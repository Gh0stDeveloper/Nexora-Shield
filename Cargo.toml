[workspace]
resolver = "2"
members = [
    "crates/shield-core",
    "crates/shield-attestation",
    "crates/shield-package",
    "crates/shield-dex",
    "crates/shield-diversity",
    "crates/shield-crypto",
    "crates/shield-integrity",
    "crates/shield-lab",
    "crates/shield-native",
    "crates/shield-rasp",
    "crates/shield-vm",
    "crates/shield-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
publish = false
authors = ["Gh0stDeveloper"]
repository = "https://github.com/Gh0stDeveloper/Nexora-Shield"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
