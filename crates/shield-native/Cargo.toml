[package]
name = "nexora-shield-native"
description = "Native runtime, JNI boundary, ABI policy and native integrity helpers for Nexora Shield."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
nexora-shield-crypto = { path = "../shield-crypto" }
nexora-shield-vm = { path = "../shield-vm" }
nexora-shield-integrity = { path = "../shield-integrity" }
nexora-shield-package = { path = "../shield-package" }
nexora-shield-rasp = { path = "../shield-rasp" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
subtle = "2.6.1"
zeroize = "1.8.1"
jni = { version = "=0.21.1", optional = true, default-features = false }

[features]
android-runtime = ["dep:jni"]

[build-dependencies]
serde_json = "1.0"
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
