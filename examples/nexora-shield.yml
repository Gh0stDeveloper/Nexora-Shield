# Schema-v1 declarative example. The CLI's O.1.1 typed policy resolver does not
# yet import YAML files; declarative file binding belongs to Phase O.5.
# Do NOT treat this example as evidence of enabled runtime protection.
schema: 1

application:
  id: com.example.app
  minSdk: 24

profile: hardened

build:
  diversity: true
  reproducible: false
  diversityMode: unique_build

selectors:
  sensitive:
    include:
      - com.example.auth.**
      - com.example.billing.**
    exclude:
      - com.example.generated.**

dex:
  rename: true
  metadataReduction: true
  controlFlow:
    enabled: true
    scope: sensitive

crypto:
  enabled: true
  algorithm: xchacha20poly1305-hkdf-sha256-v1
  rootKeyRef: env:NEXORA_ROOT_KEY
  stringThreshold: sensitive

resources:
  dataProtection: true
  include:
    - assets/private/**
  allowAssets: true
  allowResRaw: false

integrity:
  enabled: true
  certificatePolicy: exact_current
  dexChunkBytes: 16384
  resourcePaths:
    - assets/private/config.json

rasp:
  enabled: true
  mode: enforce
  responses:
    high: require_reverification
    critical: deny_sensitive_operation

native:
  enabled: true
  apiLevel: 24
  abis:
    - arm64-v8a
    - x86_64
  allow32Bit: false

vm:
  enabled: true
  mode: config_only
  selectors:
    - classPattern: com.example.auth.**
      methodPattern: "*"
  eligibility:
    maxRegisters: 64
    maxInstructions: 2000

attestation:
  enabled: false

budgets:
  apkGrowthPercent: 20
  startupMs: 80
  buildMinutes: 10

budgetsPolicy: fail
