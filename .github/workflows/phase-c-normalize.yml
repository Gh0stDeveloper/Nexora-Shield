name: Phase C Normalize

on:
  push:
    branches:
      - feat/phase-c-data-protection

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Phase C branch
        uses: actions/checkout@v5
        with:
          ref: feat/phase-c-data-protection
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Normalize workspace
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Commit normalization
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/shield-crypto crates/shield-cli Cargo.toml
          git commit -m "style: normalize Phase C and refresh lockfile"
          git push origin HEAD:feat/phase-c-data-protection
