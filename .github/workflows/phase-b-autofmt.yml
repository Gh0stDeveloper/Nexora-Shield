name: Phase B Autofmt

on:
  push:
    branches:
      - feat/phase-b-dex-engine

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Phase B branch
        uses: actions/checkout@v5
        with:
          ref: feat/phase-b-dex-engine
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply rustfmt after Phase B fixes"
          git push origin HEAD:feat/phase-b-dex-engine
