name: Phase B Autofmt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify formatting only
        run: cargo fmt --all -- --check
