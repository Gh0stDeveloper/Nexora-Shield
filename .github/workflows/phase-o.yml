name: Phase O

on:
  push:
    branches:
      - main
      - feat/phase-o0-release-freeze
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase-o-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  o1-dex-preflight:
    name: O.1 APK DEX preflight (read-only E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Generate real DEX inputs plus adversarial APKs
        run: python scripts/testing/make-phase-o1-fixtures.py
      - name: Verify production planner inspects both DEX units and emits no output
        run: |
          cargo run --locked --quiet -p nexora-shield -- protect build/phase-o1/valid.apk \
            --output build/phase-o1/not-created.apk \
            --profile maximum --unsigned --no-align --plan-only \
            > build/phase-o1/plan.txt
          grep -q 'READ-ONLY, NOT PROTECTED' build/phase-o1/plan.txt
          grep -q 'DEX units: 2' build/phase-o1/plan.txt
          grep -q 'Production ready: false' build/phase-o1/plan.txt
          grep -q 'Stage vm-shield: Required, NotIntegrated' build/phase-o1/plan.txt
          test ! -e build/phase-o1/not-created.apk
      - name: Resolve standard hardened and maximum profiles without mutating APKs
        shell: bash
        run: |
          set -euo pipefail
          for profile in standard hardened maximum; do
            cargo run --locked --quiet -p nexora-shield -- \
              protect build/phase-o1/valid.apk \
              --output "build/phase-o1/not-created-${profile}.apk" \
              --profile "${profile}" --unsigned --no-align --plan-only \
              > "build/phase-o1/plan-${profile}.txt"
            grep -q "Profile: ${profile}" "build/phase-o1/plan-${profile}.txt"
            grep -q 'Stage dex-transform: Required, DiagnosticOnly' "build/phase-o1/plan-${profile}.txt"
            grep -q 'Production ready: false' "build/phase-o1/plan-${profile}.txt"
            test ! -e "build/phase-o1/not-created-${profile}.apk"
          done
          grep -q 'Stage data-protection: WhenSelected, NotIntegrated' build/phase-o1/plan-standard.txt
          grep -q 'Stage data-protection: Required, NotIntegrated' build/phase-o1/plan-hardened.txt
          grep -q 'Stage native-shield: Required, NotIntegrated' build/phase-o1/plan-maximum.txt
          grep -q 'Stage vm-shield: Required, NotIntegrated' build/phase-o1/plan-maximum.txt

      - name: O.1.1 resolved policy rejects downgrade and unsupported production
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p nexora-shield -- \
            protect build/phase-o1/valid.apk \
            --output build/phase-o1/o11-not-created.apk \
            --profile standard --unsigned --no-align --plan-only \
            --enable-control vm-shield --enable-control attestation \
            > build/phase-o1/o11-selected.txt
          grep -q 'Effective control vm-shield: true' build/phase-o1/o11-selected.txt
          grep -q 'Effective control attestation: true' build/phase-o1/o11-selected.txt
          grep -q 'Stage vm-shield: Required, NotIntegrated' build/phase-o1/o11-selected.txt
          grep -q 'Stage attestation: Required, NotIntegrated' build/phase-o1/o11-selected.txt
          grep -q 'Production ready: false' build/phase-o1/o11-selected.txt
          test ! -e build/phase-o1/o11-not-created.apk
          if cargo run --locked --quiet -p nexora-shield -- \
            protect build/phase-o1/valid.apk --output build/phase-o1/o11-forbidden.apk \
            --profile maximum --unsigned --no-align --plan-only \
            --disable-control native-shield > build/phase-o1/o11-rejected.txt 2>&1; then
            echo 'Maximum profile downgrade was accepted' >&2
            exit 1
          fi
          grep -q "native-shield" build/phase-o1/o11-rejected.txt
          if cargo run --locked --quiet -p nexora-shield -- \
            protect build/phase-o1/valid.apk --output build/phase-o1/o11-forbidden.apk \
            --profile standard --unsigned --no-align --plan-only \
            --enable-control attestation --disable-control attestation \
            > build/phase-o1/o11-duplicate.txt 2>&1; then
            echo 'Duplicate control override was accepted' >&2
            exit 1
          fi
          grep -q 'duplicate production control override' build/phase-o1/o11-duplicate.txt
          test ! -e build/phase-o1/o11-forbidden.apk
          cargo test --locked -p nexora-shield-core policy::tests

      - name: O.1.2 multidex selector contract and invalid-policy rejection
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p nexora-shield -- \
            protect build/phase-o1/valid.apk \
            --output build/phase-o1/o12-not-created.apk \
            --profile hardened --unsigned --no-align --plan-only \
            --method 'Lcom/test/A;#run' --class 'Lcom/test/B;' \
            > build/phase-o1/o12-selection.txt
          grep -q 'DEX units: 2' build/phase-o1/o12-selection.txt
          grep -q 'classes.dex: classes=1, methods=1, fields=0, selected=0/1/0' build/phase-o1/o12-selection.txt
          grep -q 'classes2.dex: classes=1, methods=1, fields=0, selected=1/0/0' build/phase-o1/o12-selection.txt
          grep -q 'Cross-DEX reflection risk: false' build/phase-o1/o12-selection.txt
          grep -q 'Production ready: false' build/phase-o1/o12-selection.txt
          test ! -e build/phase-o1/o12-not-created.apk
          cargo run --locked --quiet -p nexora-shield -- \
            protect build/phase-o1/valid.apk --output build/phase-o1/o12-excluded.apk \
            --profile hardened --unsigned --no-align --plan-only \
            --exclude-class 'Lcom/test/B;' > build/phase-o1/o12-exclusion.txt
          grep -q 'classes2.dex: classes=1, methods=1, fields=0, selected=0/1/0' build/phase-o1/o12-exclusion.txt
          test ! -e build/phase-o1/o12-excluded.apk
          for mode in unmatched empty duplicate; do
            args=(--profile hardened --unsigned --no-align --plan-only)
            case "$mode" in
              unmatched) args+=(--class 'Lmissing/NotDefined;') ;;
              empty) args+=(--class 'Lcom/test/A;' --exclude-class 'Lcom/test/A;') ;;
              duplicate) args+=(--method 'Lcom/test/A;#run' --method 'Lcom/test/A;#run') ;;
            esac
            if cargo run --locked --quiet -p nexora-shield -- \
                protect build/phase-o1/valid.apk --output build/phase-o1/o12-forbidden.apk \
                "${args[@]}" > "build/phase-o1/o12-${mode}.txt" 2>&1; then
              echo "O.1.2 accepted invalid selector request: $mode" >&2
              exit 1
            fi
            test ! -e build/phase-o1/o12-forbidden.apk
          done
          grep -q 'include selector matched no defined DEX symbols' build/phase-o1/o12-unmatched.txt
          grep -q 'effective DEX selector selection is empty' build/phase-o1/o12-empty.txt
          grep -q 'duplicate DEX selector rule' build/phase-o1/o12-duplicate.txt
          cargo test --locked -p nexora-shield-core dex_selection::tests
          cargo test --locked -p nexora-shield-dex multidex_parser_rejects
      - name: O.1.3 verify real fixed-layout transformations and audit invariant
        run: |
          cargo test --locked -p nexora-shield-dex o13_
          cargo test --locked -p nexora-shield-dex canonical_multidex_round_trip

      - name: Production protect must never return a Phase A packaging-only APK
        shell: bash
        run: |
          set -euo pipefail
          if cargo run --locked --quiet -p nexora-shield -- \
            protect build/phase-o1/valid.apk \
            --output build/phase-o1/forbidden-production.apk \
            --profile hardened --unsigned --no-align \
            --public-report build/phase-o1/forbidden-public.json \
            --private-report build/phase-o1/forbidden-private.json \
            > build/phase-o1/production-denied.txt 2>&1; then
            echo "Security regression: incomplete production path returned success" >&2
            exit 1
          fi
          grep -q 'production protection unavailable' build/phase-o1/production-denied.txt
          test ! -e build/phase-o1/forbidden-production.apk
          test ! -e build/phase-o1/forbidden-public.json
          test ! -e build/phase-o1/forbidden-private.json

      - name: Rebuild and verify a diagnostic APK with real transformed DEX
        run: |
          cargo run --locked --quiet -p nexora-shield-core --example stage_dex -- \
            build/phase-o1/valid.apk build/phase-o1/dex-staged.apk > build/phase-o1/staging.txt
          grep -q 'DEX STAGING ONLY' build/phase-o1/staging.txt
          grep -q 'Changed DEX units: 2' build/phase-o1/staging.txt
          python - <<'PY'
          import zipfile
          from pathlib import Path
          folder = Path("build/phase-o1")
          with zipfile.ZipFile(folder / "valid.apk") as original, zipfile.ZipFile(folder / "dex-staged.apk") as rebuilt:
              assert set(original.namelist()) == set(rebuilt.namelist())
              assert original.read("AndroidManifest.xml") == rebuilt.read("AndroidManifest.xml")
              for name in ("classes.dex", "classes2.dex"):
                  assert original.read(name) != rebuilt.read(name)
                  assert rebuilt.getinfo(name).compress_type == zipfile.ZIP_STORED
                  (folder / "rewritten").mkdir(exist_ok=True)
                  (folder / "rewritten" / name).write_bytes(rebuilt.read(name))
          PY
          cargo run --locked --quiet -p nexora-shield -- dex-multidex-verify \
            build/phase-o1/rewritten/classes.dex build/phase-o1/rewritten/classes2.dex
      - name: O.1.3 protected retrace sidecar never enters diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p nexora-shield-crypto retrace::tests
          cargo test --locked -p nexora-shield-core retrace_tests
          python - <<'PY'
          import os
          from pathlib import Path
          key = Path("build/phase-o1/retrace-test-key")
          descriptor = os.open(key, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          try:
              os.write(descriptor, os.urandom(32))
          finally:
              os.close(descriptor)
          PY
          cargo run --locked --quiet -p nexora-shield-core --example stage_dex -- \
            build/phase-o1/valid.apk build/phase-o1/secure-stage.apk \
            --retrace-map build/phase-o1/private-retrace.nsr \
            --retrace-key-file build/phase-o1/retrace-test-key \
            --application-id com.nexora.fixture --build-id ci-o13-retrace \
            > build/phase-o1/secure-retrace-stage.txt
          grep -q 'DEX STAGING ONLY' build/phase-o1/secure-retrace-stage.txt
          cargo run --locked --quiet -p nexora-shield-core --example retrace_inspect -- \
            build/phase-o1/secure-stage.apk build/phase-o1/private-retrace.nsr \
            build/phase-o1/retrace-test-key com.nexora.fixture ci-o13-retrace \
            > build/phase-o1/retrace-inspection.txt
          grep -q 'Private retrace map authenticated' build/phase-o1/retrace-inspection.txt
          grep -q 'Retrace records:' build/phase-o1/retrace-inspection.txt
          if cargo run --locked --quiet -p nexora-shield-core --example retrace_inspect -- \
            build/phase-o1/valid.apk build/phase-o1/private-retrace.nsr \
            build/phase-o1/retrace-test-key com.nexora.fixture ci-o13-retrace; then
            echo 'retrace map was accepted for the wrong APK hash' >&2
            exit 1
          fi
          if cargo run --locked --quiet -p nexora-shield-core --example retrace_inspect -- \
            build/phase-o1/secure-stage.apk build/phase-o1/private-retrace.nsr \
            build/phase-o1/retrace-test-key com.nexora.fixture wrong-build; then
            echo 'retrace map accepted a wrong build identity' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import os, stat, zipfile
          parent = Path("build/phase-o1")
          protected = parent / "private-retrace.nsr"
          blob = protected.read_bytes()
          assert blob[:4] == b"NSC1", "must be authenticated ciphertext"
          assert b"Lcom/test/" not in blob, "class names must not leak"
          assert b'"original"' not in blob, "raw mapping keys must not leak"
          assert stat.S_IMODE(protected.stat().st_mode) == 0o600
          with zipfile.ZipFile(parent / "secure-stage.apk") as apk:
              assert not any("retrace" in name.lower() for name in apk.namelist())
          corrupted = bytearray(blob)
          corrupted[-1] ^= 1
          (parent / "corrupted-retrace.nsr").write_bytes(corrupted)
          os.chmod(parent / "corrupted-retrace.nsr", 0o600)
          PY
          if cargo run --locked --quiet -p nexora-shield-core --example retrace_inspect -- \
            build/phase-o1/secure-stage.apk build/phase-o1/corrupted-retrace.nsr \
            build/phase-o1/retrace-test-key com.nexora.fixture ci-o13-retrace; then
            echo 'tampered retrace container passed authentication' >&2
            exit 1
          fi
          if cargo run --locked --quiet -p nexora-shield-core --example stage_dex -- \
            build/phase-o1/valid.apk build/phase-o1/refused-stage.apk \
            --retrace-map build/phase-o1/private-retrace.nsr \
            --retrace-key-file build/phase-o1/retrace-test-key \
            --application-id com.nexora.fixture --build-id ci-o13-retrace; then
            echo 'security regression: allowed replacing a protected retrace map' >&2
            exit 1
          fi
          test ! -e build/phase-o1/refused-stage.apk
      - name: Accept bounded DEFLATE DEX and preserve compression-safe reconstruction
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p nexora-shield -- \
            protect build/phase-o1/compressed-dex.apk \
            --output build/phase-o1/not-created-deflate.apk \
            --unsigned --no-align --plan-only > build/phase-o1/deflate-plan.txt
          grep -q 'DEX units: 1' build/phase-o1/deflate-plan.txt
          test ! -e build/phase-o1/not-created-deflate.apk
          cargo run --locked --quiet -p nexora-shield-core --example stage_dex -- \
            build/phase-o1/compressed-dex.apk build/phase-o1/deflate-staged.apk \
            > build/phase-o1/deflate-stage.txt
          grep -q 'DEX STAGING ONLY' build/phase-o1/deflate-stage.txt
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("build/phase-o1/compressed-dex.apk") as original, \
               zipfile.ZipFile("build/phase-o1/deflate-staged.apk") as rebuilt:
              assert original.read("classes.dex") != rebuilt.read("classes.dex")
              assert rebuilt.getinfo("classes.dex").compress_type == zipfile.ZIP_STORED
              assert original.read("AndroidManifest.xml") == rebuilt.read("AndroidManifest.xml")
          PY
      - name: Reject malformed, corrupt/oversized compressed and duplicate-class DEX inputs
        shell: bash
        run: |
          set -euo pipefail
          for variant in invalid-dex corrupt-deflate oversized-deflate duplicate-class crc-mismatch; do
            if cargo run --locked --quiet -p nexora-shield -- \
                protect "build/phase-o1/${variant}.apk" \
                --output build/phase-o1/rejected.apk \
                --unsigned --no-align --plan-only; then
              echo "Rejected ${variant} unexpectedly passed read-only DEX preflight" >&2
              exit 1
            fi
            test ! -e build/phase-o1/rejected.apk
          done

  o1-stage-contracts:
    name: O.1 typed stage graph contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run stage graph contracts
        run: cargo test --locked -p nexora-shield-core production::tests


  o1-studio-preflight:
    name: O.1 Shield Studio production preflight routing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Compile Studio and test fail-closed production planning
        run: gradle -p studio desktopTest --no-daemon --stacktrace

  o0-release-freeze:
    name: O.0 release freeze and audit baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Phase O baseline and finding inventory
        run: python scripts/release/verify-phase-o-release-freeze.py

      - name: Prove stable publication is blocked
        shell: bash
        run: |
          if python scripts/release/verify-phase-o-release-freeze.py --channel stable; then
            echo "Phase O freeze is open but stable channel was unexpectedly allowed" >&2
            exit 1
          fi
          echo "Stable publication correctly rejected while Phase O is open."

      - name: Prove controlled RC channel remains available
        run: python scripts/release/verify-phase-o-release-freeze.py --channel rc

      - name: Validate Phase O documentation
        run: |
          python scripts/release/verify-docs.py
          grep -q 'OPEN — RELEASE BLOCKING' docs/PHASE-O.md
          grep -q 'NO-GO for public stable' docs/PRODUCTION-READINESS-AUDIT.md
          grep -q 'Phase O.0 — Release Freeze and Audit Baseline' docs/PHASE-O0-BASELINE.md
          grep -q 'Accepted Risk Policy' docs/PHASE-O-ACCEPTED-RISK.md
