name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "security/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Validate JSON schema syntax
        run: python -m json.tool schemas/nexora-shield.schema.json >/dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

      - name: CLI smoke test
        run: |
          cargo run --quiet -p nexora-shield -- --version
          cargo run --quiet -p nexora-shield -- profiles

  dependency-audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependency lockfile
        run: cargo audit --locked
