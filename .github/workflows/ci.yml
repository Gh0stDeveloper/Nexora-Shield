name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "security/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Validate JSON schema syntax
        run: python -m json.tool schemas/nexora-shield.schema.json >/dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

      - name: CLI smoke test
        run: |
          cargo run --quiet -p nexora-shield -- --version
          cargo run --quiet -p nexora-shield -- profiles

  dependency-audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependency lockfile
        run: cargo audit


  phase-a-e2e:
    name: Phase A APK pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java for keytool
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Create synthetic APK fixture
        run: |
          mkdir -p build/phase-a
          python - <<'PY'
          import zipfile
          from pathlib import Path

          path = Path("build/phase-a/input.apk")
          with zipfile.ZipFile(path, "w", compression=zipfile.ZIP_STORED) as apk:
              apk.writestr("classes2.dex", b"dex-two")
              apk.writestr("META-INF/OLD.SF", b"stale-signature")
              apk.writestr("AndroidManifest.xml", b'<manifest package="dev.nexora.phasea"/>')
              apk.writestr("classes.dex", b"dex-one")
              apk.writestr("META-INF/OLD.RSA", b"stale-signature-block")
          PY

      - name: Create ephemeral test signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore build/phase-a/test.p12 \
            -storetype PKCS12 \
            -storepass phase-a-password \
            -keypass phase-a-password \
            -alias phase-a \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Nexora Shield Phase A, O=CI, C=MX"

      - name: Protect, align and sign APK
        env:
          NEXORA_TEST_KS_PASS: phase-a-password
          NEXORA_TEST_KEY_PASS: phase-a-password
        run: |
          cargo run --quiet -p nexora-shield -- protect build/phase-a/input.apk \
            --output build/phase-a/protected.apk \
            --profile hardened \
            --keystore build/phase-a/test.p12 \
            --alias phase-a \
            --ks-pass-env NEXORA_TEST_KS_PASS \
            --key-pass-env NEXORA_TEST_KEY_PASS \
            --min-sdk 24 \
            --public-report build/phase-a/public-report.json \
            --private-report build/phase-a/private-report.json

      - name: Inspect protected APK
        run: cargo run --quiet -p nexora-shield -- inspect build/phase-a/protected.apk --json

      - name: Verify protected APK signature
        run: cargo run --quiet -p nexora-shield -- verify build/phase-a/protected.apk --signature --min-sdk 24

      - name: Validate build reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          public = json.loads(Path("build/phase-a/public-report.json").read_text())
          private = json.loads(Path("build/phase-a/private-report.json").read_text())

          assert public["signed"] is True
          assert public["aligned"] is True
          assert public["dex_count"] == 2
          assert public["stripped_signature_entries"] == 2
          assert "published" in public["stages"]
          assert private["build_id"] == public["build_id"]
          PY

  phase-b-dex:
    name: Phase B DEX engine
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create golden DEX fixtures
        run: |
          mkdir -p build/phase-b
          python - <<'PY'
          import hashlib
          import struct
          import zlib
          from pathlib import Path

          DEX_HEADER_SIZE = 0x70
          DEX_ENDIAN_CONSTANT = 0x12345678

          def uleb(value: int) -> bytes:
              out = bytearray()
              while True:
                  byte = value & 0x7f
                  value >>= 7
                  if value:
                      byte |= 0x80
                  out.append(byte)
                  if not value:
                      return bytes(out)

          def put_u16(buf: bytearray, off: int, value: int) -> None:
              buf[off:off + 2] = struct.pack("<H", value)

          def put_u32(buf: bytearray, off: int, value: int) -> None:
              buf[off:off + 4] = struct.pack("<I", value)

          def build(path: Path, descriptor: str, method_name: str) -> None:
              strings = [
                  descriptor,
                  "Ljava/lang/Object;",
                  "V",
                  method_name,
                  "A.java",
              ]

              string_ids_off = DEX_HEADER_SIZE
              type_ids_off = string_ids_off + len(strings) * 4
              proto_ids_off = type_ids_off + 3 * 4
              method_ids_off = proto_ids_off + 12
              class_defs_off = method_ids_off + 8
              data_off = class_defs_off + 32

              data = bytearray(data_off)
              string_offsets = []
              for value in strings:
                  string_offsets.append(len(data))
                  data += uleb(len(value.encode("utf-16-le")) // 2)
                  data += value.encode("ascii")
                  data.append(0)

              while len(data) % 4:
                  data.append(0)

              code_off = len(data)
              data += struct.pack("<HHHHIIH", 0, 0, 0, 0, 0, 1, 0x000e)

              class_data_off = len(data)
              data += uleb(0)
              data += uleb(0)
              data += uleb(1)
              data += uleb(0)
              data += uleb(0)
              data += uleb(0x0009)
              data += uleb(code_off)

              file_size = len(data)
              data[0:8] = b"dex\n035\0"
              put_u32(data, 32, file_size)
              put_u32(data, 36, DEX_HEADER_SIZE)
              put_u32(data, 40, DEX_ENDIAN_CONSTANT)
              put_u32(data, 44, 0)
              put_u32(data, 48, 0)
              put_u32(data, 52, 0)
              put_u32(data, 56, len(strings))
              put_u32(data, 60, string_ids_off)
              put_u32(data, 64, 3)
              put_u32(data, 68, type_ids_off)
              put_u32(data, 72, 1)
              put_u32(data, 76, proto_ids_off)
              put_u32(data, 80, 0)
              put_u32(data, 84, 0)
              put_u32(data, 88, 1)
              put_u32(data, 92, method_ids_off)
              put_u32(data, 96, 1)
              put_u32(data, 100, class_defs_off)
              put_u32(data, 104, file_size - data_off)
              put_u32(data, 108, data_off)

              for index, offset in enumerate(string_offsets):
                  put_u32(data, string_ids_off + index * 4, offset)

              put_u32(data, type_ids_off, 0)
              put_u32(data, type_ids_off + 4, 1)
              put_u32(data, type_ids_off + 8, 2)

              put_u32(data, proto_ids_off, 2)
              put_u32(data, proto_ids_off + 4, 2)
              put_u32(data, proto_ids_off + 8, 0)

              put_u16(data, method_ids_off, 0)
              put_u16(data, method_ids_off + 2, 0)
              put_u32(data, method_ids_off + 4, 3)

              put_u32(data, class_defs_off, 0)
              put_u32(data, class_defs_off + 4, 1)
              put_u32(data, class_defs_off + 8, 1)
              put_u32(data, class_defs_off + 12, 0)
              put_u32(data, class_defs_off + 16, 4)
              put_u32(data, class_defs_off + 20, 0)
              put_u32(data, class_defs_off + 24, class_data_off)
              put_u32(data, class_defs_off + 28, 0)

              data[12:32] = hashlib.sha1(data[32:]).digest()
              put_u32(data, 8, zlib.adler32(data[12:]) & 0xffffffff)
              path.write_bytes(data)

          build(Path("build/phase-b/classes.dex"), "Lcom/test/A;", "run")
          build(Path("build/phase-b/classes2.dex"), "Lcom/test/B;", "go")
          PY

      - name: Run targeted Phase B tests
        run: cargo test --quiet -p nexora-shield-dex --test phase_b

      - name: Inspect golden DEX
        run: cargo run --quiet -p nexora-shield -- dex-inspect build/phase-b/classes.dex

      - name: Verify writer round-trip
        run: |
          cargo run --quiet -p nexora-shield -- dex-roundtrip build/phase-b/classes.dex \
            --output build/phase-b/roundtrip.dex
          cmp build/phase-b/classes.dex build/phase-b/roundtrip.dex

      - name: Apply compatible rename and metadata reduction
        run: |
          cargo run --quiet -p nexora-shield -- dex-rewrite build/phase-b/classes.dex \
            --output build/phase-b/rewritten.dex \
            --rename \
            --strip-metadata \
            --seed 0x4e45584f52415348
          cargo run --quiet -p nexora-shield -- dex-inspect build/phase-b/rewritten.dex

      - name: Validate multidex set
        run: |
          cargo run --quiet -p nexora-shield -- dex-multidex-verify \
            build/phase-b/classes.dex \
            build/phase-b/classes2.dex

  phase-c-data-protection:
    name: Phase C Data Protection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXORA_PHASE_C_ROOT: "4242424242424242424242424242424242424242424242424242424242424242"
      NEXORA_PHASE_C_PROBE: "NX_PHASE_C_CRITICAL_TOKEN_0123456789"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Phase C tests
        run: cargo test --locked --quiet -p nexora-shield-crypto --test phase_c

      - name: Create plaintext exposure fixture
        run: |
          mkdir -p build/phase-c
          python - <<'PY'
          import os
          from pathlib import Path

          probe = os.environ["NEXORA_PHASE_C_PROBE"].encode()
          payload = b"A" * 32768 + probe + b"B" * 32768
          Path("build/phase-c/plain.bin").write_bytes(payload)
          PY

      - name: Protect fixture
        run: |
          cargo run --locked --quiet -p nexora-shield -- data-protect build/phase-c/plain.bin             --output build/phase-c/protected.nsc             --kind generic             --id ci.phase-c.payload             --app-id dev.nexora.phasec             --build-id phase-c-ci             --key-env NEXORA_PHASE_C_ROOT

      - name: Assert plaintext is absent
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          protected = Path("build/phase-c/protected.nsc").read_bytes()
          probe = os.environ["NEXORA_PHASE_C_PROBE"].encode()
          assert probe not in protected
          assert b"ci.phase-c.payload" not in protected
          PY

      - name: Inspect protected container
        run: cargo run --locked --quiet -p nexora-shield -- data-inspect build/phase-c/protected.nsc

      - name: Authenticate and decrypt fixture
        run: |
          cargo run --locked --quiet -p nexora-shield -- data-unprotect build/phase-c/protected.nsc             --output build/phase-c/recovered.bin             --kind generic             --id ci.phase-c.payload             --app-id dev.nexora.phasec             --build-id phase-c-ci             --key-env NEXORA_PHASE_C_ROOT
          cmp build/phase-c/plain.bin build/phase-c/recovered.bin

      - name: Reject tampered container
        run: |
          cp build/phase-c/protected.nsc build/phase-c/tampered.nsc
          python - <<'PY'
          from pathlib import Path

          path = Path("build/phase-c/tampered.nsc")
          data = bytearray(path.read_bytes())
          data[-1] ^= 0x80
          path.write_bytes(data)
          PY
          if cargo run --locked --quiet -p nexora-shield -- data-unprotect build/phase-c/tampered.nsc             --output build/phase-c/should-not-exist.bin             --kind generic             --id ci.phase-c.payload             --app-id dev.nexora.phasec             --build-id phase-c-ci             --key-env NEXORA_PHASE_C_ROOT; then
            echo "tampered container unexpectedly decrypted" >&2
            exit 1
          fi

      - name: Verify per-build diversification
        run: |
          cargo run --locked --quiet -p nexora-shield -- data-protect build/phase-c/plain.bin             --output build/phase-c/protected-second-build.nsc             --kind generic             --id ci.phase-c.payload             --app-id dev.nexora.phasec             --build-id phase-c-ci-second             --key-env NEXORA_PHASE_C_ROOT
          if cmp -s build/phase-c/protected.nsc build/phase-c/protected-second-build.nsc; then
            echo "different build identities produced identical protected bytes" >&2
            exit 1
          fi

      - name: Enforce exposure and overhead budget
        run: |
          cargo run --locked --quiet -p nexora-shield -- data-benchmark             build/phase-c/plain.bin build/phase-c/protected.nsc             --probe-env NEXORA_PHASE_C_PROBE             --label phase-c-critical-token             --max-overhead 2.0

  phase-c-msrv:
    name: Phase C Rust 1.81 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.81
        uses: dtolnay/rust-toolchain@1.81.0

      - name: Test crypto crate on declared MSRV
        run: cargo +1.81.0 test --locked -p nexora-shield-crypto --all-targets

      - name: Check CLI on declared MSRV
        run: cargo +1.81.0 check --locked -p nexora-shield

  phase-d-integrity:
    name: Phase D Integrity / Anti-Tamper
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java for signing fixtures
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Phase D tests
        run: cargo test --locked --quiet -p nexora-shield-integrity --test phase_d

      - name: Create Phase D content fixtures
        run: |
          mkdir -p build/phase-d
          printf '%s' '{"endpoint":"https://example.invalid/api","mode":"strict"}' > build/phase-d/config.json
          printf '\177ELFphase-d-native-fixture-v1' > build/phase-d/libnexora.so
          python - <<'PY'
          import hashlib
          import struct
          import zlib
          from pathlib import Path

          DEX_HEADER_SIZE = 0x70
          DEX_ENDIAN_CONSTANT = 0x12345678

          def uleb(value: int) -> bytes:
              out = bytearray()
              while True:
                  byte = value & 0x7f
                  value >>= 7
                  if value:
                      byte |= 0x80
                  out.append(byte)
                  if not value:
                      return bytes(out)

          def put_u16(buf: bytearray, off: int, value: int) -> None:
              buf[off:off + 2] = struct.pack("<H", value)

          def put_u32(buf: bytearray, off: int, value: int) -> None:
              buf[off:off + 4] = struct.pack("<I", value)

          strings = [
              "Ldev/nexora/phased/Main;",
              "Ljava/lang/Object;",
              "V",
              "run",
              "Main.java",
          ]
          string_ids_off = DEX_HEADER_SIZE
          type_ids_off = string_ids_off + len(strings) * 4
          proto_ids_off = type_ids_off + 3 * 4
          method_ids_off = proto_ids_off + 12
          class_defs_off = method_ids_off + 8
          data_off = class_defs_off + 32

          data = bytearray(data_off)
          string_offsets = []
          for value in strings:
              string_offsets.append(len(data))
              data += uleb(len(value.encode("utf-16-le")) // 2)
              data += value.encode("ascii")
              data.append(0)

          while len(data) % 4:
              data.append(0)

          code_off = len(data)
          data += struct.pack("<HHHHIIH", 0, 0, 0, 0, 0, 1, 0x000e)
          class_data_off = len(data)
          data += uleb(0) + uleb(0) + uleb(1) + uleb(0)
          data += uleb(0) + uleb(0x0009) + uleb(code_off)

          file_size = len(data)
          data[0:8] = b"dex\n035\0"
          put_u32(data, 32, file_size)
          put_u32(data, 36, DEX_HEADER_SIZE)
          put_u32(data, 40, DEX_ENDIAN_CONSTANT)
          put_u32(data, 56, len(strings))
          put_u32(data, 60, string_ids_off)
          put_u32(data, 64, 3)
          put_u32(data, 68, type_ids_off)
          put_u32(data, 72, 1)
          put_u32(data, 76, proto_ids_off)
          put_u32(data, 88, 1)
          put_u32(data, 92, method_ids_off)
          put_u32(data, 96, 1)
          put_u32(data, 100, class_defs_off)
          put_u32(data, 104, file_size - data_off)
          put_u32(data, 108, data_off)

          for index, offset in enumerate(string_offsets):
              put_u32(data, string_ids_off + index * 4, offset)

          put_u32(data, type_ids_off, 0)
          put_u32(data, type_ids_off + 4, 1)
          put_u32(data, type_ids_off + 8, 2)
          put_u32(data, proto_ids_off, 2)
          put_u32(data, proto_ids_off + 4, 2)
          put_u32(data, proto_ids_off + 8, 0)
          put_u16(data, method_ids_off, 0)
          put_u16(data, method_ids_off + 2, 0)
          put_u32(data, method_ids_off + 4, 3)
          put_u32(data, class_defs_off, 0)
          put_u32(data, class_defs_off + 4, 1)
          put_u32(data, class_defs_off + 8, 1)
          put_u32(data, class_defs_off + 16, 4)
          put_u32(data, class_defs_off + 24, class_data_off)

          data[12:32] = hashlib.sha1(data[32:]).digest()
          put_u32(data, 8, zlib.adler32(data[12:]) & 0xffffffff)
          Path("build/phase-d/classes.dex").write_bytes(data)
          PY

      - name: Create two independent signing certificates
        run: |
          keytool -genkeypair -noprompt             -keystore build/phase-d/signer-a.p12             -storetype PKCS12             -storepass phase-d-pass             -keypass phase-d-pass             -alias signer-a             -keyalg RSA             -keysize 2048             -validity 3650             -dname "CN=Nexora Shield Phase D A, O=CI, C=MX"
          keytool -genkeypair -noprompt             -keystore build/phase-d/signer-b.p12             -storetype PKCS12             -storepass phase-d-pass             -keypass phase-d-pass             -alias signer-b             -keyalg RSA             -keysize 2048             -validity 3650             -dname "CN=Nexora Shield Phase D B, O=CI, C=MX"
          python - <<'PY'
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile("build/phase-d/base.apk", "w", compression=zipfile.ZIP_STORED) as apk:
              apk.writestr("AndroidManifest.xml", b'<manifest package="dev.nexora.phased"/>')
              apk.writestr("classes.dex", Path("build/phase-d/classes.dex").read_bytes())
          PY
          cp build/phase-d/base.apk build/phase-d/app-a.apk
          cp build/phase-d/base.apk build/phase-d/app-b.apk

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign             --min-sdk-version 24             --ks build/phase-d/signer-a.p12             --ks-key-alias signer-a             --ks-pass pass:phase-d-pass             --key-pass pass:phase-d-pass             build/phase-d/app-a.apk
          "$APKSIGNER" sign             --min-sdk-version 24             --ks build/phase-d/signer-b.p12             --ks-key-alias signer-b             --ks-pass pass:phase-d-pass             --key-pass pass:phase-d-pass             build/phase-d/app-b.apk

          CERTS_A="$("$APKSIGNER" verify --min-sdk-version 24 --print-certs build/phase-d/app-a.apk)"
          CERTS_B="$("$APKSIGNER" verify --min-sdk-version 24 --print-certs build/phase-d/app-b.apk)"
          printf '%s\n' "$CERTS_A"
          printf '%s\n' "$CERTS_B"
          SIGNER_A="$(printf '%s\n' "$CERTS_A" | sed -n 's/.*SHA-256 digest:[[:space:]]*//p' | head -n 1)"
          SIGNER_B="$(printf '%s\n' "$CERTS_B" | sed -n 's/.*SHA-256 digest:[[:space:]]*//p' | head -n 1)"
          test -n "$SIGNER_A"
          test -n "$SIGNER_B"
          test "$SIGNER_A" != "$SIGNER_B"
          echo "SIGNER_A=$SIGNER_A" >> "$GITHUB_ENV"
          echo "SIGNER_B=$SIGNER_B" >> "$GITHUB_ENV"

      - name: Build integrity manifest
        run: |
          cargo run --locked --quiet -p nexora-shield -- integrity-create             --output build/phase-d/integrity.json             --build-id phase-d-ci             --app-id dev.nexora.phased             --version-code 77             --signer-sha256 "$SIGNER_A"             --dex classes.dex=build/phase-d/classes.dex             --resource assets/config.json=build/phase-d/config.json             --native lib/arm64-v8a/libnexora.so=build/phase-d/libnexora.so             --seed phase-d-ci-distribution             --checks 5             --redundancy 2

      - name: Inspect and verify clean evidence
        run: |
          cargo run --locked --quiet -p nexora-shield -- integrity-inspect build/phase-d/integrity.json
          cargo run --locked --quiet -p nexora-shield -- integrity-verify build/phase-d/integrity.json             --observed-signer-sha256 "$SIGNER_A"             --app-id dev.nexora.phased             --version-code 77             --dex classes.dex=build/phase-d/classes.dex             --artifact assets/config.json=build/phase-d/config.json             --artifact lib/arm64-v8a/libnexora.so=build/phase-d/libnexora.so

      - name: Verify one distributed check
        run: |
          cargo run --locked --quiet -p nexora-shield -- integrity-verify build/phase-d/integrity.json             --observed-signer-sha256 "$SIGNER_A"             --app-id dev.nexora.phased             --version-code 77             --dex classes.dex=build/phase-d/classes.dex             --artifact assets/config.json=build/phase-d/config.json             --artifact lib/arm64-v8a/libnexora.so=build/phase-d/libnexora.so             --check-id 0

      - name: Reject re-signed evidence
        run: |
          if cargo run --locked --quiet -p nexora-shield -- integrity-verify build/phase-d/integrity.json             --observed-signer-sha256 "$SIGNER_B"             --app-id dev.nexora.phased             --version-code 77             --dex classes.dex=build/phase-d/classes.dex             --artifact assets/config.json=build/phase-d/config.json             --artifact lib/arm64-v8a/libnexora.so=build/phase-d/libnexora.so; then
            echo "re-signed evidence unexpectedly passed" >&2
            exit 1
          fi

      - name: Reject patched resource
        run: |
          cp build/phase-d/config.json build/phase-d/config-patched.json
          printf '\npatched=true\n' >> build/phase-d/config-patched.json
          if cargo run --locked --quiet -p nexora-shield -- integrity-verify build/phase-d/integrity.json             --observed-signer-sha256 "$SIGNER_A"             --app-id dev.nexora.phased             --version-code 77             --dex classes.dex=build/phase-d/classes.dex             --artifact assets/config.json=build/phase-d/config-patched.json             --artifact lib/arm64-v8a/libnexora.so=build/phase-d/libnexora.so; then
            echo "patched resource unexpectedly passed" >&2
            exit 1
          fi

      - name: Reject patched DEX
        run: |
          cp build/phase-d/classes.dex build/phase-d/classes-patched.dex
          python - <<'PY'
          from pathlib import Path

          path = Path("build/phase-d/classes-patched.dex")
          data = bytearray(path.read_bytes())
          data[-1] ^= 0x01
          path.write_bytes(data)
          PY
          if cargo run --locked --quiet -p nexora-shield -- integrity-verify build/phase-d/integrity.json             --observed-signer-sha256 "$SIGNER_A"             --app-id dev.nexora.phased             --version-code 77             --dex classes.dex=build/phase-d/classes-patched.dex             --artifact assets/config.json=build/phase-d/config.json             --artifact lib/arm64-v8a/libnexora.so=build/phase-d/libnexora.so; then
            echo "patched DEX unexpectedly passed" >&2
            exit 1
          fi

      - name: Reject replaced native library
        run: |
          cp build/phase-d/libnexora.so build/phase-d/libnexora-patched.so
          printf 'patch' >> build/phase-d/libnexora-patched.so
          if cargo run --locked --quiet -p nexora-shield -- integrity-verify build/phase-d/integrity.json             --observed-signer-sha256 "$SIGNER_A"             --app-id dev.nexora.phased             --version-code 77             --dex classes.dex=build/phase-d/classes.dex             --artifact assets/config.json=build/phase-d/config.json             --artifact lib/arm64-v8a/libnexora.so=build/phase-d/libnexora-patched.so; then
            echo "replaced native library unexpectedly passed" >&2
            exit 1
          fi

      - name: Reject repackaged package identity
        run: |
          if cargo run --locked --quiet -p nexora-shield -- integrity-verify build/phase-d/integrity.json             --observed-signer-sha256 "$SIGNER_A"             --app-id dev.nexora.repacked             --version-code 77             --dex classes.dex=build/phase-d/classes.dex             --artifact assets/config.json=build/phase-d/config.json             --artifact lib/arm64-v8a/libnexora.so=build/phase-d/libnexora.so; then
            echo "repackaged identity unexpectedly passed" >&2
            exit 1
          fi

